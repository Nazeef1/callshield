# Render Blueprint for CallShield: agent console, voice enrollment, customer phone and ready-made
# deepfake samples (frontend/samples). Runs fully in the cloud: no laptop needed.
# Live voice cloning (Attack Lab) needs a GPU, so it is disabled here; the clones were generated
# in advance from a consenting team member's own voice and ship as samples.
services:
  - type: web
    name: callshield
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CALLSHIELD_ATTACK_LAB
        value: "0"
      - key: DETECTIF_API_KEY
        sync: false   # paste your DetectifAI key in the Render dashboard; never committed
