# Render Blueprint for CallShield: the receive screen (/) and the phone app's pages (/app.html).
# The Attack Lab needs the presenter's laptop (local GPU cloner, laptop-only gating), so it is off here.
services:
  - type: web
    name: callshield
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CALLSHIELD_ATTACK_LAB
        value: "0"
      - key: DETECTIF_API_KEY
        sync: false   # paste your DetectifAI key in the Render dashboard; never committed
